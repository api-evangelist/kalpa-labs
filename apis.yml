aid: kalpa-labs
name: Kalpa Labs
description: >-
  Kalpa Labs is a San Francisco audio-research lab (Y Combinator Fall 2025) building
  generalist speech models that unify text-to-speech, multi-speaker conversation, voice
  cloning, and speech-in / speech-out reasoning behind one API — steerable with natural
  instructions and in-context learning the way a large language model is. Their Kalpa
  Speech API exposes stable public model ids over a clean REST interface: POST /v1/tts
  turns text into 24 kHz WAV audio, POST /v1/converse completes the open turn of a
  conversation (authored speech or contextual TTS), and a stateful WebSocket streams
  multi-speaker sessions. The developer surface ships a committed OpenAPI 3.1 contract,
  an AsyncAPI 3.0 WebSocket protocol, docs with a markdown twin per page, an llms.txt,
  and a browser Studio playground. Founded by Prashant Shishodia and Gautam Jha.
