description: >-
  Each API key has a sustained requests-per-minute allowance and a burst capacity
  (a token bucket: `burst` requests available at once, refilling at the sustained
  rate). Exact values are set per key at provisioning; raise them via hello@kalpalabs.ai.
signaling_headers:
- header: X-RateLimit-Limit
  meaning: Your sustained requests/minute
- header: X-RateLimit-Remaining
  meaning: Requests left in the bucket right now
- header: X-RateLimit-Reset
  meaning: Seconds until the bucket refills
- header: Retry-After
  meaning: Seconds to wait after a 429
over_limit:
  status: 429
  type: rate_limit_exceeded
  guidance: Honor Retry-After and back off; all generation requests are safe to retry.
